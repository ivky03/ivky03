<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Vignesh Kumar Karthikeyan — Applied AI Systems</title>
<desc id="desc">A colorful visual map showing signals flowing through data and machine learning, agentic systems, and measurable operational impact.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07142d"/><stop offset=".52" stop-color="#15114a"/><stop offset="1" stop-color="#0d2d45"/></linearGradient>
  <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset=".48" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<g opacity=".25" stroke="#7dd3fc"><path d="M0 80H1200M0 170H1200M0 260H1200M0 350H1200"/><path d="M130 0V420M330 0V420M530 0V420M730 0V420M930 0V420M1130 0V420"/></g>
<text x="70" y="82" font-family="Arial, sans-serif" font-size="20" fill="#67e8f9" letter-spacing="4">VIGNESH KUMAR KARTHIKEYAN</text>
<text x="70" y="126" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#f8fafc">Applied AI Systems Builder</text>
<text x="70" y="158" font-family="Arial, sans-serif" font-size="18" fill="#cbd5e1">Turning complex operations into data products, AI agents, and measurable outcomes.</text>
<path d="M185 292 C300 210, 370 340, 490 270 S690 212, 810 280 S1010 345, 1110 245" fill="none" stroke="url(#flow)" stroke-width="6" filter="url(#glow)"/>
<g font-family="Arial, sans-serif">
  <g transform="translate(75 238)"><circle cx="70" cy="52" r="48" fill="#083c57" stroke="#22d3ee" stroke-width="3"/><text x="70" y="48" text-anchor="middle" font-size="28">◌</text><text x="70" y="112" text-anchor="middle" fill="#e0f2fe" font-size="17" font-weight="700">SIGNALS</text><text x="70" y="135" text-anchor="middle" fill="#94a3b8" font-size="13">data • context</text></g>
  <g transform="translate(330 238)"><circle cx="70" cy="52" r="48" fill="#302064" stroke="#a78bfa" stroke-width="3"/><text x="70" y="49" text-anchor="middle" font-size="27">⌁</text><text x="70" y="112" text-anchor="middle" fill="#ede9fe" font-size="17" font-weight="700">INTELLIGENCE</text><text x="70" y="135" text-anchor="middle" fill="#c4b5fd" font-size="13">ML • RAG • LLMs</text></g>
  <g transform="translate(585 238)"><circle cx="70" cy="52" r="48" fill="#5a1f55" stroke="#f472b6" stroke-width="3"/><text x="70" y="50" text-anchor="middle" font-size="27">✦</text><text x="70" y="112" text-anchor="middle" fill="#fce7f3" font-size="17" font-weight="700">ORCHESTRATION</text><text x="70" y="135" text-anchor="middle" fill="#f9a8d4" font-size="13">agents • tools</text></g>
  <g transform="translate(900 238)"><circle cx="70" cy="52" r="48" fill="#14532d" stroke="#4ade80" stroke-width="3"/><text x="70" y="50" text-anchor="middle" font-size="27">↗</text><text x="70" y="112" text-anchor="middle" fill="#dcfce7" font-size="17" font-weight="700">IMPACT</text><text x="70" y="135" text-anchor="middle" fill="#86efac" font-size="13">decisions • scale</text></g>
</g>
